# Drop-in di Business Network Wizard per tinyproxy.service
# (installato come /usr/lib/systemd/system/tinyproxy.service.d/bnw.conf)
[Service]
Type=simple
PIDFile=
# Allinea la modalita alla rete reale prima di ogni avvio, cosi un riavvio con il
# symlink rimasto su "upstream" non lascia la macchina senza rete (e viceversa sul
# WiFi aziendale non la lascia senza proxy). --symlink non riavvia niente: sarebbe
# ricorsivo, visto che siamo dentro l'avvio di tinyproxy.
ExecStartPre=/usr/lib/bnw/proxy-detect --symlink
ExecStart=
ExecStart=/usr/bin/tinyproxy -d -c /etc/tinyproxy/active.conf
Restart=always
RestartSec=2
