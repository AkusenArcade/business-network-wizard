# Drop-in di Business Network Wizard per cntlm.service
# (installato come /usr/lib/systemd/system/cntlm.service.d/bnw.conf)
[Service]
# L'unit del pacchetto usa "killall -9": systemd lo registra come fallimento.
ExecStop=
# cntlm sul SIGTERM avvia uno "clean shutdown" che attende le connessioni aperte e non
# rientra nel timeout: systemd finiva per SIGKILL-arlo e marcare l'unit failed.
# Non ha stato da persistere: lo fermiamo direttamente e accettiamo l'esito.
KillSignal=SIGKILL
TimeoutStopSec=5
SuccessExitStatus=SIGKILL SIGTERM
