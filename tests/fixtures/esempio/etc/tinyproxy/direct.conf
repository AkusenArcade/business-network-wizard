# tinyproxy - modalita DIRETTA (VPN non attiva)
User tinyproxy
Group tinyproxy
Port 8118
Listen 127.0.0.1
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogLevel Warning
MaxClients 100
Allow 127.0.0.1
Allow ::1
DisableViaHeader Yes
# Nessuna direttiva "upstream": tinyproxy si connette direttamente.
