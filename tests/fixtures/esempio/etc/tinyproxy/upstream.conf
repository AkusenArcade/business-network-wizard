# tinyproxy - modalita PROXY AZIENDALE (VPN attiva)
# Regole tradotte da http://proxy.corp.esempio/proxy.pac
User tinyproxy
Group tinyproxy
Port 8118
Listen 127.0.0.1
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogLevel Warning
MaxClients 100
Allow 127.0.0.1
Allow ::1
DisableViaHeader Yes

# Reti private e domini interni -> DIRETTO (come le isInNet() del PAC)
upstream none "localhost"
upstream none "127.0.0.0/8"
upstream none "10.0.0.0/8"
upstream none "172.16.0.0/12"
upstream none "192.168.0.0/16"
upstream none ".corp.esempio"
upstream none ".esempioprod"
# esempio.it e' split-horizon: dall'interno risolve su 10.x e il proxy aziendale
# non lo raggiunge (504). Le regole per IP sopra non bastano: tinyproxy confronta
# l'hostname della richiesta, non l'indirizzo risolto.
upstream none "esempio.it"
upstream none ".esempio.it"

# Tutto il resto -> cntlm, che autentica in NTLM verso 10.20.30.40:3128
upstream http 127.0.0.1:3128
